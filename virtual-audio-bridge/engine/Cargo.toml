[package]
name = "vab-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.9", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
getrandom = "0.4"
local-ip-address = "0.6"
opus = "0.4"
qrcode = { version = "0.15", default-features = false, features = ["std", "svg"] }
ring = "0.17"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
str0m = { version = "0.26", default-features = false, features = ["rust-crypto"] }
tokio = { version = "1", features = ["full"] }
time = "0.3"

[target."cfg(windows)".dependencies]
wasapi = "0.27"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console"] }

[features]
# Solo para pruebas automatizadas: sustituye los dispositivos WASAPI por una fuente
# de prueba y un medidor. Nunca se activa en la compilación de usuario.
test-io = []

[profile.release]
lto = "thin"
codegen-units = 1
